plugins {
    id 'java'
}

group = 'com.vigilnz.fixtures'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // CVE-2021-44228 Log4Shell
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'

    // CVE-2022-42889 Text4Shell
    implementation 'org.apache.commons:commons-text:1.9'

    // CVE-2022-1471 SnakeYAML constructor RCE
    implementation 'org.yaml:snakeyaml:1.30'

    // Deserialization gadget chains
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.8'

    // CVE-2023-20860 / CVE-2022-22965 range
    implementation 'org.springframework:spring-web:5.3.17'

    // CVE-2020-9488 / CVE-2019-17571
    implementation 'log4j:log4j:1.2.17'

    // CVE-2020-13956
    implementation 'org.apache.httpcomponents:httpclient:4.5.12'

    // CVE-2016-1000027 range
    implementation 'org.springframework:spring-core:5.2.0.RELEASE'

    testImplementation 'junit:junit:4.12'
}
