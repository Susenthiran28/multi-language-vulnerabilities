# File:    datastores.yaml
# Purpose: Secret-scanner fixture. Database and broker connection strings with
#          inline credentials, plus weak/empty password shapes.
#          Every value is synthetic and non-functional. DO NOT replace with real
#          credentials.
# Author:  Vigilnz Security Engineering
# Date:    2026-10-16
#
# Expected rules: mongodb-connection-string, postgresql-connection-string,
#   mysql-connection-string, redis-connection-string, kafka-sasl-credentials,
#   rabbitmq-credentials, password-in-url, generic-password,
#   common-weak-password, empty-or-null-password, short-password,
#   admin-username-password, generic-secret, session-secret, encryption-key

datastores:
  mongodb:
    uri: "mongodb+srv://appuser:FixturePassw0rd@cluster0.fixture.mongodb.net/app?retryWrites=true"
  postgres:
    uri: "postgresql://appuser:FixturePassw0rd@db.internal.example.com:5432/app"
  mysql:
    uri: "mysql://root:FixtureRootPass@127.0.0.1:3306/app"
  redis:
    uri: "redis://default:FixtureRedisPass@cache.internal.example.com:6379/0"
  kafka:
    sasl_username: "kafka_app"
    sasl_password: "FixtureKafkaPassw0rd"
    jaas: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"kafka_app\" password=\"FixtureKafkaPassw0rd\";"
  rabbitmq:
    uri: "amqp://appuser:FixtureRabbitPass@mq.internal.example.com:5672/%2f"

# Credentials embedded in a fetch URL
artifacts:
  feed_url: "https://deploy:FixtureDeployToken@artifacts.example.com/npm/"

# Weak-password shapes the detector should flag on their own
accounts:
  admin_username: "admin"
  admin_password: "admin123"
  legacy_password: "password"
  service_password: "abc123"
  short_password: "pass"
  blank_password: ""
  null_password: null

app:
  secret: "fixture-application-secret-value-000000"
  session_secret: "fixture-session-secret-value-0000000000"
  encryption_key: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  jwt_secret: "fixture-jwt-signing-secret-000000000000"
